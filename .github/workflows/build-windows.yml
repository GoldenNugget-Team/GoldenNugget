name: Build Windows

on:
  workflow_dispatch:


jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        submodules: recursive

      - name: Setup Python via uv
        uses: astral-sh/setup-uv@v7

      - name: Create virtual environment & install deps
        run: |
          uv venv .env --python 3.15
          uv pip install --python .env\Scripts\python.exe -r requirements.txt

      - name: Build with PyInstaller
        run: .env\Scripts\python.exe compile.py

      - name: Upload artifact
        uses: actions/upload-artifact@v6
        with:
          name: GoldenNugget-Windows
          path: dist/GoldenNugget/
          retention-days: 30
