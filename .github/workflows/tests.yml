name: Offline tests

on:
  pull_request:
  push:
    branches: [main, release]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: offline-tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: Python ${{ matrix.python }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python: ['3.14', '3.15']
    env:
      QT_QPA_PLATFORM: offscreen

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install Qt runtime libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libopengl0 libxkbcommon0 libgl1

      - name: Install project dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip check

      - name: Check Python syntax
        run: python -m compileall -q src tools main_app.py nugget_cli.py

      - name: Run offline regression suites
        run: python tools/run_tests.py

      - name: Publish test summary
        if: always()
        run: |
          if [ -f test-results/summary.md ]; then
            cat test-results/summary.md >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload test logs
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: offline-tests-python-${{ matrix.python }}
          path: test-results/
          if-no-files-found: ignore
          retention-days: 14
